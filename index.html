<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Track Record</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>

<div class="ios-header-spacer" aria-hidden="true"></div>

<main class="game">
    <header>
        <h1>TRACK<br><span>RECORD</span></h1>
        <p class="tagline">How well do you know your records?</p>
    </header>

    <section class="card">
        <div id="round-label" class="label">ALBUM</div>
        <h2 id="album">Loading…</h2>
        <div class="album-meta">
            <span id="artist" class="artist"></span>
            <span id="year" class="year"></span>
        </div>

        <div id="question-label" class="question-label">WHICH SONG WASN'T ON THIS ALBUM?</div>
        <div id="choices" class="choices"></div>

        <div class="score-status">
            <span id="score">SCORE 0 · MISSES 0 / 4</span>
        </div>

        <div id="result" class="result" aria-live="polite"></div>

        <button id="next" class="next hidden" type="button">NEXT ALBUM ›</button>
    </section>

</main>

<script src="data/albums.js"></script>
<script src="app.js"></script>
</body>
</html>
